name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Prepare Android build instructions
        run: |
          echo "Web build completed successfully."
          echo "Android wrapper will be added in the next build step once Capacitor is configured."

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tang-ketab-web-dist
          path: dist/
