<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      // Otomatis bersihkan cache peramban dan muat ulang halaman satu kali agar tampilan terbaru langsung muncul
      if (!sessionStorage.getItem('tk_force_refresh_v4')) {
        sessionStorage.setItem('tk_force_refresh_v4', 'true');
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
          });
        }
        if (navigator.serviceWorker) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        }
        setTimeout(function() {
          window.location.reload(true);
        }, 150);
      }
    </script>
    <title>Tang Ketab Pocket — Personal Pocketbook Library</title>
    <meta name="description" content="Transform your personal PDF library into an interactive, portable pocketbook experience with seamless online access." />
